# Mock experiment config file.

experiment:
  name: "mock"
  seed: 1
  description: "mock experiment on mock data, mock augmentation, mock model, and mock analysis."
  num_classes: 2

dataset:
  name: "mock_dataset"
  path: "data/processed/mock_dataset.pickle"
  params:
    text_column: "text"
    label_column: "labels"
    split:
      train_ratio: 0.8
      val_ratio: 0.1
      test_ratio: 0.1



model:
  name: "mock_model"
  type: "mock"
  params:
    loss: "squared_error"
    alpha: 0.0001
  mock_behavior: "predict_random"



augmentation:
  method: "add_noise"
  params:
    mean: 0
    std: 1 # 
    normalize: true


metrics:
  - accuracy
  - f1_score


output:
  params:
    save_embeddings: false
    save_predictions: true
    save_metrics: true
    output_dir: "results/mock"
